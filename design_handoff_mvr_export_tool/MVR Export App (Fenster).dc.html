<!-- Windows 11 Fenster, Dark -->

    </div>
    <div style="flex:1"></div>
    <div style="display:flex;height:36px">
      <div style="width:46px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.75)" style-hover="background:rgba(255,255,255,0.08)"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1"></line></svg></div>

    </div>
  </div>
  <div style="height:1000px;overflow:hidden;background:#08131f;--app-min-h:1000px">
    <dc-import name="MVR Export App" hint-size="100%,1000px"></dc-import>
  </div>
</div>
</x-dc>
