name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run ruff check
        run: ruff check .

      - name: Run pytest
        run: pytest -q

      - name: Build with PyInstaller
        run: pyinstaller build/pyinstaller.spec --noconfirm --distpath dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/MVR Enhancer.exe"
          generate_release_notes: true
